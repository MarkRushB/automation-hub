apiVersion: apps/v1
kind: Deployment
metadata:
  name: camp-monitor
  labels:
    app.kubernetes.io/name: camp-monitor
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: camp-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: camp-monitor
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: install-python-dependencies
          image: mcr.microsoft.com/playwright/python:v1.54.0-noble
          command:
            - python
            - -m
            - pip
            - install
            - --no-cache-dir
            - --target=/python-packages
            - playwright==1.54.0
          volumeMounts:
            - name: python-packages
              mountPath: /python-packages
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      containers:
        - name: camp-monitor
          image: mcr.microsoft.com/playwright/python:v1.54.0-noble
          imagePullPolicy: IfNotPresent
          command: ["python", "/app-src/camp_monitor.py"]
          args: ["--config", "/config/config.json"]
          env:
            - name: PYTHONPATH
              value: /python-packages
            - name: BARK_DEVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: camp-monitor-secrets
                  key: bark-device-key
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: source
              mountPath: /app-src
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
            - name: python-packages
              mountPath: /python-packages
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: camp-monitor-config
        - name: source
          configMap:
            name: camp-monitor-source
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: python-packages
          emptyDir: {}

