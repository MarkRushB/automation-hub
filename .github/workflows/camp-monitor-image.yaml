name: Build camp-monitor image

on:
  push:
    branches: [main]
    paths:
      - apps/camp-monitor/camp_monitor.py
      - apps/camp-monitor/Dockerfile
      - apps/camp-monitor/requirements.txt
      - .github/workflows/camp-monitor-image.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: camp-monitor-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/camp-monitor
          push: true
          tags: |
            ghcr.io/markrushb/automation-hub/camp-monitor:${{ github.sha }}
            ghcr.io/markrushb/automation-hub/camp-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image tag
        shell: bash
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" apps/camp-monitor/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/camp-monitor/k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(camp-monitor): deploy ${GITHUB_SHA} [skip ci]"
          git push

